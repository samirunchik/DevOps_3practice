name: Full Stack Application Deployment Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  COMPOSE_PROJECT_NAME: myapp

jobs:
  deploy-and-test:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file from secrets
        run: |
          Write-Host "Creating .env file from GitHub Secrets..."
          @"
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          APP_PORT=${{ secrets.APP_PORT }}
          APP_SECRET=${{ secrets.APP_SECRET }}
          API_KEY=${{ secrets.API_KEY }}
          COMPOSE_PROJECT_NAME=${{ env.COMPOSE_PROJECT_NAME }}
          "@ | Set-Content -Path .env -Encoding UTF8

          Write-Host "Contents (masked):"
          Get-Content .env | ForEach-Object { $_ -replace '=.*', '=***' }

      - name: Deploy with Docker Compose
        run: |
          Write-Host "Starting application stack..."
          docker-compose up -d
          Write-Host "Waiting for services to start..."
          Start-Sleep -Seconds 30
          Write-Host "Checking container status..."
          docker-compose ps

      - name: Verify containers are running
        run: |
          $psOutput = docker-compose ps
          if ($psOutput -match "Up|running") {
            Write-Host "All containers are running"
          } else {
            Write-Host "Some containers failed to start"
            docker-compose logs
            exit 1
          }

      - name: Run application tests
        run: |
          Write-Host "1. Testing application and database connectivity..."
          $health = Invoke-WebRequest -Uri "http://localhost:${{ secrets.APP_PORT }}/health" -UseBasicParsing
          if ($health.StatusCode -eq 200) {
            Write-Host "Web application is healthy"
          } else {
            Write-Host "Web application health check failed"
            exit 1
          }

          $api = Invoke-WebRequest -Uri "http://localhost:${{ secrets.APP_PORT }}/api/data" -UseBasicParsing
          if ($api.StatusCode -eq 200) {
            Write-Host "Application database connection working"
          } else {
            Write-Host "Application database connection failed"
            exit 1
          }

          Write-Host "2. Testing data consistency..."
          $dbCount = (docker-compose exec -T db psql -U ${{ secrets.DB_USER }} -d ${{ secrets.DB_NAME }} -t -c "SELECT COUNT(*) FROM items;").Trim()
          $webCount = (Invoke-WebRequest -Uri "http://localhost:${{ secrets.APP_PORT }}/api/items/count" -UseBasicParsing).Content.Trim()

          Write-Host "Database count: $dbCount"
          Write-Host "Web API count: $webCount"

          if ($dbCount -eq $webCount) {
            Write-Host "Data consistency test passed"
          } else {
            Write-Host "Data consistency test failed"
            exit 1
          }

      - name: Create test report
        run: |
          $dbCount = (docker-compose exec -T db psql -U ${{ secrets.DB_USER }} -d ${{ secrets.DB_NAME }} -t -c "SELECT COUNT(*) FROM items;").Trim()
          $webCount = (Invoke-WebRequest -Uri "http://localhost:${{ secrets.APP_PORT }}/api/items/count" -UseBasicParsing).Content.Trim()
          $currentDate = Get-Date
          @"
          # Deployment Test Report
          - Date: $currentDate
          - Application: Healthy
          - Database: Connected
          - Data Consistency: Passed
          - Containers: Running
          ## Environment Variables
          - DB_HOST: ${{ secrets.DB_HOST }}
          - DB_NAME: ${{ secrets.DB_NAME }}
          - APP_PORT: ${{ secrets.APP_PORT }}
          ## Test Results
          - Database records: $dbCount
          - Web API records: $webCount
          "@ | Set-Content -Path test-report.md -Encoding UTF8

      - name: Save Docker logs
        if: always()
        run: |
          docker-compose logs > deployment-logs.txt
          docker images > docker-images.txt
          docker ps -a > docker-ps.txt

      - name: Save artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deployment-artifacts
          path: |
            .env
            test-report.md
            deployment-logs.txt
            docker-images.txt
            docker-ps.txt
          retention-days: 30
